<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Доходи</title>
    <link rel="icon" type="image/png" href="images/logoYPM.svg">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/dohodpage.css">
    <link rel="stylesheet" href="css/Modal/modalProfile.css">
    <link rel="stylesheet" href="css/Modal/modalFilter.css">
    <link rel="stylesheet" href="css/Modal/modalType.css">
    <link rel="stylesheet" href="css/Modal/modalTransactionFilter.css">
</head>
<body>
<header class="header">
   <div class="header-left">
        <div class="logo">
          <img src="images/logoYPM.svg" alt="YuPeMo">
          <h4><span style="-webkit-text-stroke: 1px #4A4D45; color: #E6FFBE;">YuPeMo</span></h4>
        </div>
        <nav class="menu">
           <button onclick="window.location.href='mainpage.html';" class="mainpage"><b>Головня Сторінка</b></button> 
           <button onclick="window.location.href='mainservicepage.html';" class="mainservicepage"><b>Загальна Статистика</b></button> 
           <button onclick="window.location.href='vitraty.html';" class="minusmoney"><b>Витрати</b></button>
           <button onclick="window.location.href='cili.html';" class="goal"><b>Цілі</b></button>
        </nav>
    </div>
    <div class="header-right">
       <div class="user" onclick="openModal()">
           <span id="openProfile">Ім'я_користувача</span>
           <img src="images/user.svg" alt="user">
       </div>
    </div>
</header>

<dialog id="profileModal" class="Modal"> 
   <div class="modal-content">
    <div class="modal-header"><h2>Профіль</h2></div>
    <div class="modal-body">
      <div class="profile-settings">
        <button class="userprofile">Параметри</button>
        <button class="userprofile">Синхронізація з банком</button>
        <button class="userprofile">Покупки</button>
        <button class="userprofile">Борги</button>
        <button onclick="closeModal()" class="closeMod">Назад</button>
        <button class="profileMod" onclick="window.location.href='index.html';">Вийти</button>
      </div>
      <div class="settings-panel"></div>
    </div>
   </div>
</dialog>

<dialog id="TypeModalDohod" class="Modal"> 
  <div class="modal-content">
    <div class="modal-header"><h2>Тип показника</h2></div>
    <div class="modal-body">
     <div class="left">
       <label class="type-item"><input type="radio" name="chartType"> Кільцева Діаграма</label>
       <label class="type-item"><input type="radio" name="chartType"> Кругова Діаграма</label>
       <label class="type-item"><input type="radio" name="chartType"> Гістограма</label>
       <label class="type-item"><input type="radio" name="chartType"> Точкова Діаграма</label>
       <label class="type-item"><input type="radio" name="chartType"> Календарь</label>
     </div>
     <div class="right">
        <button id="agreeModalDohod" class="confirm">Підтвердити</button>
        <button id="TypeCloseModalDohod" class="cancel">Скасувати</button>
     </div>
    </div>
  </div>
</dialog>  

<dialog id="FilterModalDohod" class="Modal"> 
  <div class="modal-content">
    <div class="modal-header"><h2>Фільтр</h2></div>
    <div class="modal-body">
     <div class="left">
       <label class="type-item"><input type="radio" name="chartFilter"> За день</label>
       <label class="type-item"><input type="radio" name="chartFilter"> За 7 днів</label>
       <label class="type-item"><input type="radio" name="chartFilter"> За місяць</label>
     </div>
     <div class="right">
        <button id="agreeModalDohod1" class="confirm">Підтвердити</button>
        <button id="FilterCloseModalDohod" class="cancel">Скасувати</button>
     </div>
    </div>
  </div>
</dialog> 

<dialog id="TransactionDohodFilterModal" class="Modal transaction-filter-modal"> 
  <div class="modal-content">
    <div class="modal-header"><h2>Фільтр транзакцій</h2></div>
    <div class="modal-body transaction-filter-body">
      <div class="transaction-filter-left">
        <div class="filter-group">
          <h4>Період</h4>
          <label class="type-item"><input type="radio" name="transactionPeriod" value="day"> За день</label>
          <label class="type-item"><input type="radio" name="transactionPeriod" value="week"> За 7 днів</label>
          <label class="type-item"><input type="radio" name="transactionPeriod" value="month"> За місяць</label>
          <label class="type-item"><input type="radio" name="transactionPeriod" value="all" checked> За весь час</label>
        </div>
      </div>
      <div class="transaction-filter-right">
        <button id="applyTransactionDohodFilter" class="confirm">Підтвердити</button>
        <button id="closeTransactionDohodFilter" class="cancel">Скасувати</button>
      </div>
    </div>
  </div>
</dialog>

<main class="container">
    <section class="left">
        <h3 class="balance">ДОХІД: n$</h3>
        <div class="chart-header">
            <div class="filters">
                <button class="type" id="openTypeDohod">▾ Тип</button>
                <button class="filterinfo" id="openFilterDohod">▾ Фільтр</button>
            </div>
        </div>
        <div class="graph">
            <img src="images/graph.jpg" alt="graph">
        </div>
    </section>

    <section class="right">
        <h3>ДОХОДИ</h3>
        <div class="buttons">
            <button class="filterinfo" id="openTransactionDohodFilter">▾ Фільтр</button>
            <button class="addtrans">+ Додати дохід</button>
        </div>
        <table class="table">
            <thead>
                <tr>
                    <th>Дата</th>
                    <th>Категорія</th>
                    <th>Коментар</th>
                    <th>Сума($)</th>
                </tr>
            </thead>
            <tbody>
                <tr><td></td><td></td><td></td><td></td></tr>
            </tbody>
        </table>
    </section>
</main>

<script>
function openModal()  { document.getElementById('profileModal').showModal(); }
function closeModal() { document.getElementById('profileModal').close(); }

const typeModal   = document.getElementById("TypeModalDohod");
const filterModal = document.getElementById("FilterModalDohod");
const txModal     = document.getElementById("TransactionDohodFilterModal");

document.getElementById("openTypeDohod").addEventListener("click",      () => typeModal.showModal());
document.getElementById("TypeCloseModalDohod").addEventListener("click",() => typeModal.close());
document.getElementById("agreeModalDohod").addEventListener("click",    () => typeModal.close());

document.getElementById("openFilterDohod").addEventListener("click",       () => filterModal.showModal());
document.getElementById("FilterCloseModalDohod").addEventListener("click", () => filterModal.close());
document.getElementById("agreeModalDohod1").addEventListener("click",      () => filterModal.close());

document.getElementById("openTransactionDohodFilter").addEventListener("click",  () => txModal.showModal());
document.getElementById("closeTransactionDohodFilter").addEventListener("click", () => txModal.close());
document.getElementById("applyTransactionDohodFilter").addEventListener("click", () => txModal.close());
</script>
</body>
</html>
