<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Загальна Статистика</title>
    <link rel="icon" type="image/png" href="images/logoYPM.svg">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/mainservicepage.css">
    <link rel="stylesheet" href="css/Modal/modalProfile.css">
    <link rel="stylesheet" href="css/Modal/modalType.css">
    <link rel="stylesheet" href="css/Modal/modalFilter.css">
    <link rel="stylesheet" href="css/Modal/modalTransactionFilter.css">
</head>
<body>
<header class="header">
   <div class="header-left">
        <div class="logo">
          <img src="images/logoYPM.svg" alt="YuPeMo">
          <h4><span style="-webkit-text-stroke: 1px #4A4D45; color: #E6FFBE;">YuPeMo</span></h4>
        </div>
        <nav class="menu">
           <button onclick="window.location.href='mainpage.html';" class="mainpage"><b>Головня Сторінка</b></button> 
           <button onclick="window.location.href='dohod.html';" class="plusmoney"><b>Доходи</b></button> 
           <button onclick="window.location.href='vitraty.html';" class="minusmoney"><b>Витрати</b></button>
           <button onclick="window.location.href='cili.html';" class="goal"><b>Цілі</b></button>
        </nav>
    </div>
    <div class="header-right">
       <div class="user" onclick="openModal()">
           <span id="openProfile" style="cursor:pointer">Ім'я_користувача</span>
           <img style="cursor:pointer" src="images/user.svg" alt="user">
       </div>
    </div>
</header>

<dialog id="profileModal" class="Modal"> 
   <div class="modal-content">
    <div class="modal-header"><h2>Профіль</h2></div>
    <div class="modal-body">
      <div class="profile-settings">
        <button class="userprofile">Параметри</button>
        <button class="userprofile">Синхронізація з банком</button>
        <button class="userprofile">Покупки</button>
        <button class="userprofile">Борги</button>
        <button onclick="closeModal()" class="closeMod">Назад</button>
        <button class="profileMod" onclick="window.location.href='index.html';">Вийти</button>
      </div>
      <div class="settings-panel"></div>
    </div>
   </div>
</dialog>

<dialog id="TypeModal" class="Modal"> 
  <div class="modal-content">
    <div class="modal-header"><h2>Тип показника</h2></div>
    <div class="modal-body">
     <div class="left">
       <label class="type-item"><input type="radio" name="chartType"> Кільцева Діаграма</label>
       <label class="type-item"><input type="radio" name="chartType"> Кругова Діаграма</label>
       <label class="type-item"><input type="radio" name="chartType"> Гістограма</label>
       <label class="type-item"><input type="radio" name="chartType"> Точкова Діаграма</label>
       <label class="type-item"><input type="radio" name="chartType"> Календарь</label>
     </div>
     <div class="right">
        <button id="agreeModal" class="confirm">Підтвердити</button>
        <button id="TypeCloseModal" class="cancel">Скасувати</button>
     </div>
    </div>
  </div>
</dialog>    

<dialog id="FilterModal" class="Modal"> 
  <div class="modal-content">
    <div class="modal-header"><h2>Фільтр</h2></div>
    <div class="modal-body">
     <div class="left">
       <label class="type-item"><input type="radio" name="chartFilter"> За день</label>
       <label class="type-item"><input type="radio" name="chartFilter"> За 7 днів</label>
       <label class="type-item"><input type="radio" name="chartFilter"> За місяць</label>
       <label class="type-item"><input type="radio" name="chartFilter"> Тільки Доходи</label>
       <label class="type-item"><input type="radio" name="chartFilter"> Тільки витрати</label>
     </div>
     <div class="right">
        <button id="agreeModal1" class="confirm">Підтвердити</button>
        <button id="closeModal1" class="cancel">Скасувати</button>
     </div>
    </div>
  </div>
</dialog>  

<dialog id="TransactionFilterModal" class="Modal transaction-filter-modal"> 
  <div class="modal-content">
    <div class="modal-header"><h2>Фільтр транзакцій</h2></div>
    <div class="modal-body transaction-filter-body">
      <div class="transaction-filter-left">
        <div class="filter-group">
          <h4>Тип транзакції</h4>
          <label class="type-item"><input type="radio" name="transactionType" value="all" checked> Усі транзакції</label>
          <label class="type-item"><input type="radio" name="transactionType" value="income"> Тільки доходи</label>
          <label class="type-item"><input type="radio" name="transactionType" value="expense"> Тільки витрати</label>
        </div>
        <div class="filter-group">
          <h4>Період</h4>
          <label class="type-item"><input type="radio" name="transactionPeriod" value="day"> За день</label>
          <label class="type-item"><input type="radio" name="transactionPeriod" value="week"> За 7 днів</label>
          <label class="type-item"><input type="radio" name="transactionPeriod" value="month"> За місяць</label>
          <label class="type-item"><input type="radio" name="transactionPeriod" value="all" checked> За весь час</label>
        </div>
        <div class="filter-group">
          <h4>Категорія</h4>
          <select id="transactionCategoryFilter" class="filter-select">
            <option value="all">Усі категорії</option>
            <option value="Зарплата">Зарплата</option>
            <option value="Стипендія">Стипендія</option>
            <option value="Їжа">Їжа</option>
            <option value="Транспорт">Транспорт</option>
            <option value="Покупки">Покупки</option>
            <option value="Інше">Інше</option>
          </select>
        </div>
      </div>
      <div class="transaction-filter-right">
        <button id="applyTransactionFilter" class="confirm">Підтвердити</button>
        <button id="closeTransactionFilter" class="cancel">Скасувати</button>
      </div>
    </div>
  </div>
</dialog>

<main class="container">
    <section class="left">
        <h3 class="balance">БАЛАНС: n$</h3>
        <div class="chart-header">
            <div class="balance">
                <div>Доходи:</div>
                <div>Витрати:</div>
            </div>
            <div class="filters">
                <button id="openType" class="type">▾ Тип</button>
                <button id="openFilter" class="filterinfo">▾ Фільтр</button>
            </div>
        </div>
        <div class="graph">
            <img src="images/graph.jpg" alt="graph">
        </div>
        <div class="legend">
            <div class="legend-item"><div class="box expense"></div><span>Витрати</span></div>
            <div class="legend-item"><div class="box income"></div><span>Доходи</span></div>
        </div>
    </section>

    <section class="right">
        <h3>ОСТАННІ ТРАНЗАКЦІЇ</h3>
        <div class="buttons">
            <button class="filterinfo" id="openTransactionFilter">▾ Фільтр</button>
        </div>
        <table class="table">
            <thead>
                <tr>
                    <th>Дата</th>
                    <th>Категорія</th>
                    <th>Тип</th>
                    <th>Сума($)</th>
                </tr>
            </thead>
            <tbody>
                <tr><td></td><td></td><td></td><td></td></tr>
            </tbody>
        </table>
    </section>
</main>

<script>
function openModal()  { document.getElementById('profileModal').showModal(); }
function closeModal() { document.getElementById('profileModal').close(); }

const typeModal   = document.getElementById("TypeModal");
const filterModal = document.getElementById("FilterModal");
const txModal     = document.getElementById("TransactionFilterModal");

document.getElementById("openType").addEventListener("click",   () => typeModal.showModal());
document.getElementById("TypeCloseModal").addEventListener("click", () => typeModal.close());
document.getElementById("agreeModal").addEventListener("click", () => typeModal.close());

document.getElementById("openFilter").addEventListener("click",  () => filterModal.showModal());
document.getElementById("closeModal1").addEventListener("click", () => filterModal.close());
document.getElementById("agreeModal1").addEventListener("click", () => filterModal.close());

document.getElementById("openTransactionFilter").addEventListener("click",  () => txModal.showModal());
document.getElementById("closeTransactionFilter").addEventListener("click", () => txModal.close());
document.getElementById("applyTransactionFilter").addEventListener("click", () => txModal.close());
</script>
</body>
</html>
